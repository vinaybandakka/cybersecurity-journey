      - Write a short PR-style comment for each with the risk and the fix.
      - Answer the week 5 questions in sme/INTERVIEW_QUESTIONS.md out loud.
    explain: "A developer says 'the framework handles security'. Respond with two examples where it does not."
    deliverable: notes/week-05-review.md

  # ---------------------------------------------------------------- Phase 6
