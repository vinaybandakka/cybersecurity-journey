    deliverable: reports/mini-pentest-report.md

  # ---------------------------------------------------------------- Phase 7
  - day: 43
    title: Security logging and SIEM fundamentals
    area: Defensive
    outcome: Explain what to log, how a SIEM normalises and correlates data, and investigate raw logs.
