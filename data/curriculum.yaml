      - {t: "PwnFunction: Cross-Site Scripting (XSS) Explained (YouTube)", u: "https://www.youtube.com/watch?v=EoaDgUgS6QA"}
      - {t: "OWASP XSS Prevention Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"}
    lab:
      - Solve the reflected and stored XSS apprentice labs on PortSwigger.
      - Solve the Juice Shop 'DOM XSS' challenge.
      - Write a CSP that would have blocked your payload, and explain which directive did it.
    explain: "If cookies are HttpOnly, is XSS still dangerous? Explain."
    deliverable: labs/writeups/portswigger-xss.md

  - day: 31
    title: Broken access control and IDOR
    area: Web
    outcome: Find horizontal and vertical privilege escalation and explain server-side authorization checks.
    learn:
      - {t: "PortSwigger Web Security Academy: Access control vulnerabilities", u: "https://portswigger.net/web-security/access-control"}
      - {t: "OWASP Top 10: A01 Broken Access Control", u: "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"}
    lab:
      - Solve two access control apprentice labs (unprotected admin, user ID in request parameter).
      - In Juice Shop, view another user's basket by changing an ID in Burp.
      - Write the code-level fix (check ownership on the server for every object access).
    explain: "Why has broken access control been the number one OWASP risk, and why can scanners rarely find it?"
    deliverable: labs/writeups/portswigger-access-control.md

  - day: 32
    title: Authentication flaws, sessions and CSRF
    area: Web
    outcome: Attack weak login and session handling in labs and explain CSRF and its defences.
    learn:
      - {t: "PortSwigger Web Security Academy: Authentication vulnerabilities", u: "https://portswigger.net/web-security/authentication"}
      - {t: "PortSwigger Web Security Academy: CSRF", u: "https://portswigger.net/web-security/csrf"}
      - {t: "PwnFunction: Cross-Site Request Forgery (CSRF) Explained (YouTube)", u: "https://www.youtube.com/watch?v=eWEgUcHPle0"}
    lab:
      - Solve the username enumeration via different responses lab.
      - Solve the CSRF vulnerability with no defences lab.
      - Note how SameSite=Lax cookies change the CSRF picture.
    explain: "How do SameSite cookies, CSRF tokens and re-authentication each reduce CSRF risk?"
    deliverable: labs/writeups/portswigger-auth-csrf.md

  - day: 33
    title: SSRF, command injection and path traversal
    area: Web
    outcome: Exploit server-side injection classes in labs and explain why SSRF is critical in the cloud.
    learn:
      - {t: "PortSwigger Web Security Academy: SSRF", u: "https://portswigger.net/web-security/ssrf"}
      - {t: "PortSwigger Web Security Academy: OS command injection", u: "https://portswigger.net/web-security/os-command-injection"}
      - {t: "PortSwigger Web Security Academy: Path traversal", u: "https://portswigger.net/web-security/file-path-traversal"}
    lab:
      - Solve one apprentice lab in each of SSRF, OS command injection and path traversal.
      - Read about how SSRF to the cloud metadata endpoint (169.254.169.254) leads to stolen IAM credentials.
      - Write why IMDSv2 (session tokens, hop limit) mitigates it.
    explain: "Walk through how an SSRF bug can turn into a full AWS account compromise, and the three controls that break the chain."
    bridge: You know instance profiles and IMDS from the infrastructure side. This is the attacker's view of them.
    deliverable: labs/writeups/portswigger-server-side.md

  - day: 34
    title: API security
    area: Web
    outcome: Explain the OWASP API Security Top 10 and test an API for BOLA and mass assignment.
    learn:
      - {t: "OWASP API Security Top 10 (2023)", u: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/"}
      - {t: "PortSwigger Web Security Academy: API testing", u: "https://portswigger.net/web-security/api-testing"}
      - {t: "OWASP crAPI (completely ridiculous API)", u: "https://github.com/OWASP/crAPI"}
    lab:
      - Solve the PortSwigger 'exploiting an API endpoint using documentation' lab.
      - In Juice Shop, use the REST API through Burp to read or change data you should not have access to.
      - Map each finding to an OWASP API Top 10 item.
    explain: "Why are APIs a bigger attack surface than the web UI built on top of them?"
    deliverable: labs/writeups/api-security.md

  - day: 35
    title: Week 5 review and secure code review
    area: Review
    outcome: Spot vulnerabilities in code and explain the fix like an AppSec engineer.
