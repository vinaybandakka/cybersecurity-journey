      - Map the pentest phases (planning, recon, scanning, exploitation, post-exploitation, reporting) to what you have done so far.
    explain: "What is the difference between a vulnerability scan, a penetration test and a red team exercise?"
    deliverable: notes/day-36-roe.md

  - day: 37
    title: MITRE ATT&CK
    area: Offensive
