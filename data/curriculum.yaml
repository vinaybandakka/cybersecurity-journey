      - {t: "Computerphile: Running an SQL Injection Attack (YouTube)", u: "https://www.youtube.com/watch?v=_jKylhJtPmI"}
      - {t: "OWASP SQL Injection Prevention Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"}
    lab:
      - Solve the first two PortSwigger SQLi apprentice labs (WHERE clause and login bypass).
      - Solve the DVWA SQL Injection page at Low security.
      - Rewrite the vulnerable query in your favourite language using a parameterised query.
    explain: "Why do parameterised queries fix SQLi when input escaping often fails?"
    deliverable: labs/writeups/portswigger-sqli.md

  - day: 30
    title: Cross-site scripting (XSS)
    area: Web
    outcome: Explain reflected, stored and DOM XSS, exploit each in labs, and prevent them with encoding and CSP.
