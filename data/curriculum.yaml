# Single source of truth for the 60-day plan.
# Edit this file, then run:  python3 scripts/generate.py
# That regenerates days/*.md, tracker/notion-tracker.csv and PROGRESS.md.
#
# Every day is 45 minutes:  15 min LEARN  ->  25 min LAB  ->  5 min EXPLAIN
#
# Fields
#   day, title, area      : identifiers
#   outcome               : what you can do / explain when the day is done
#   learn                 : 1-3 resources for the 15-minute learning block (t = title, u = url)
#   lab                   : the 25-minute hands-on block, as steps
#   explain               : the question you answer out loud / in writing like an SME
#   bridge                : how your DevOps experience maps onto the topic (optional)
#   deliverable           : what you commit to the repo at the end of the day

phases:
  - id: 1
    name: Foundations and home lab
    days: [1, 7]
    goal: Think like a defender, speak the core vocabulary, and have a working lab.
    topics: [CIA triad and AAA, threats vulnerabilities and risk, control types, NIST CSF 2.0, CIS Controls, ISO 27001, Docker-based lab, Linux command line]
    milestone: Lab running, Bandit level 13 reached, risk register and CSF mapping committed.
  - id: 2
    name: Networking for security
    days: [8, 14]
    goal: Read packets, map networks and explain where each network control sits.
    topics: [OSI and TCP/IP, TCP/UDP, subnetting and NAT, common ports, DNS and DNS attacks, HTTP, Wireshark, Nmap, firewalls, IDS/IPS, segmentation, zero trust]
    milestone: Annotated packet captures, an Nmap write-up and a packet-journey diagram with controls.
  - id: 3
    name: Systems and identity
    days: [15, 21]
    goal: Harden Linux and Windows, and explain authentication, authorization and federation.
    topics: [Linux hardening, Linux logs, Windows accounts and event IDs, Sysmon, Active Directory, Kerberos, password storage, MFA and passkeys, RBAC and ABAC, cloud IAM, OAuth 2.0, OIDC, SAML, JWT]
    milestone: Lynis before/after, Windows event ID table, least-privilege IAM and RBAC policies, first PortSwigger lab.
  - id: 4
    name: Cryptography, PKI and web basics
    days: [22, 28]
    goal: Use crypto correctly, debug TLS, manage secrets, and proxy web traffic with Burp.
    topics: [AES and block modes, RSA/ECC, Diffie-Hellman, hashing, HMAC, signatures, artifact signing, PKI, TLS 1.3, mTLS, secrets management, browser security model, CORS, security headers, OWASP Top 10, Burp Suite]
    milestone: Local CA with mTLS, gitleaks finding a leaked key, Burp intercepting Juice Shop.
  - id: 5
    name: Web and API security
    days: [29, 35]
    goal: Find, exploit (in labs) and fix the OWASP Top 10 and OWASP API Top 10 classes.
    topics: [SQL injection, XSS, CSP, broken access control and IDOR, authentication flaws, CSRF, SSRF, command injection, path traversal, OWASP API Top 10, secure code review]
    milestone: At least 12 PortSwigger labs and 10 Juice Shop challenges solved with write-ups.
  - id: 6
    name: Offensive security and vulnerability management
    days: [36, 42]
    goal: Run a scoped test with a methodology, map to ATT&CK and prioritise vulns like a pro.
    topics: [ethics and rules of engagement, pentest methodology, Cyber Kill Chain, MITRE ATT&CK, CVE, CVSS, EPSS, CISA KEV, Metasploit, shells, Linux privilege escalation, phishing, SPF/DKIM/DMARC, password attacks, reporting]
    milestone: An ATT&CK Navigator layer and a mini pentest report.
  - id: 7
    name: Defensive security operations
    days: [43, 49]
    goal: Collect logs, write detections, and lead an incident from triage to lessons learned.
    topics: [security logging, SIEM, detection engineering, Sigma, incident response lifecycle, forensics basics, traffic analysis, malware types, threat intelligence, Pyramid of Pain, YARA, threat hunting, Atomic Red Team, tabletop exercises]
    milestone: Sigma and YARA rules in detections/, an IR playbook in playbooks/, a hunt write-up.
  - id: 8
    name: Cloud, containers and DevSecOps
    days: [50, 56]
    goal: Secure AWS, containers, Kubernetes and CI/CD, which is where your DevOps edge is biggest.
    topics: [shared responsibility, AWS IAM, CloudTrail, GuardDuty, S3 security, IMDSv2, container hardening, image scanning, Kubernetes RBAC, Pod Security Standards, network policies, OWASP CI/CD Top 10, SLSA, SBOM, signing, SAST/SCA/DAST/IaC/secrets scanning, threat modeling with STRIDE]
    milestone: flAWS levels 1-4, a hardened image, a secured kind cluster, a DevSecOps pipeline and a threat model.
  - id: 9
    name: GRC, architecture and capstone
    days: [57, 60]
    goal: Talk risk and compliance with leadership, design secure systems, and prove it end to end.
    topics: [risk management and RMF, policies standards and procedures, ISO 27001, SOC 2, PCI DSS, GDPR, secure design principles, security architecture, capstone, mock interview]
    milestone: Secure architecture doc, capstone report, recorded mock interview and a next-90-days plan.

days:
  # ---------------------------------------------------------------- Phase 1
  - day: 1
    title: The security mindset, CIA and AAA
    area: Foundations
    outcome: Explain confidentiality, integrity, availability, authentication, authorization and accounting with a real example of each.
    learn:
      - {t: "Professor Messer SY0-701 course (YouTube playlist): watch 'Security Controls' and 'The CIA Triad'", u: "https://www.youtube.com/playlist?list=PLG49S3nxzAnl4QDVqK-hOnoqcSKEIDDuv"}
      - {t: "NIST CSRC glossary (look up: confidentiality, integrity, availability, non-repudiation)", u: "https://csrc.nist.gov/glossary"}
    lab:
      - Clone this repo and create notes/day-01.md from notes/TEMPLATE.md.
      - Pick a system you ran in DevOps (for example a CI server or a production API).
      - For that system write one way an attacker could break C, I and A, and one control that stops each.
      - Add which AAA control is in place today (SSO? audit logs?) and which is missing.
    explain: "A product manager asks: 'We encrypt everything, so we are secure, right?' Answer in 60 seconds using CIA."
    bridge: Availability is SRE territory you already own. Security adds confidentiality and integrity to the same thinking.
    deliverable: notes/day-01.md with your CIA/AAA table.

  - day: 2
    title: Threats, vulnerabilities, risk and controls
    area: Foundations
    outcome: Define threat, vulnerability, exploit, risk and impact precisely, and classify controls by type and function.
    learn:
      - {t: "Professor Messer playlist: 'Threat Actors' and 'Common Threat Vectors' videos", u: "https://www.youtube.com/playlist?list=PLG49S3nxzAnl4QDVqK-hOnoqcSKEIDDuv"}
      - {t: "NIST SP 800-30 Rev. 1, Guide for Conducting Risk Assessments (skim chapter 2)", u: "https://csrc.nist.gov/pubs/sp/800/30/r1/final"}
    lab:
      - Build a 5-row risk register for a CI/CD pipeline in a markdown table.
      - "Columns: asset, threat, vulnerability, likelihood (1-5), impact (1-5), risk score, control, control type (preventive/detective/corrective)."
      - Include at least one supply-chain risk (for example a compromised dependency) and one insider risk.
    explain: "What is the difference between a threat, a vulnerability and a risk? Give an example from a Kubernetes cluster."
    bridge: Your incident postmortems already reason about likelihood and impact. A risk register is that, written before the incident.
    deliverable: notes/day-02.md with your risk register.

  - day: 3
    title: Security frameworks, NIST CSF 2.0 and CIS Controls
    area: Foundations
    outcome: Name the six NIST CSF 2.0 functions and explain how CIS Controls and ISO 27001 relate to it.
    learn:
      - {t: "NIST Cybersecurity Framework home", u: "https://www.nist.gov/cyberframework"}
      - {t: "CIS Critical Security Controls", u: "https://www.cisecurity.org/controls"}
      - {t: "ISO/IEC 27001 overview", u: "https://www.iso.org/standard/27001"}
    lab:
      - Draw a table with the six CSF functions (Govern, Identify, Protect, Detect, Respond, Recover).
      - Map at least two things you did in DevOps to each function (for example backups map to Recover, alerting to Detect).
      - Mark the function where your last team was weakest and write why.
    explain: "An executive asks which framework you would use for a 200-person SaaS startup and why. Answer in 90 seconds."
    deliverable: notes/day-03.md with your CSF mapping.

  - day: 4
    title: Build your home lab with Docker
    area: Foundations
    outcome: Run an isolated, disposable lab with vulnerable apps and an attacker toolbox.
    learn:
      - {t: "OWASP Juice Shop project", u: "https://owasp.org/www-project-juice-shop/"}
      - {t: "DVWA (Damn Vulnerable Web Application)", u: "https://github.com/digininja/DVWA"}
      - {t: "Kali Linux Docker images", u: "https://www.kali.org/docs/containers/official-kalilinux-docker-images/"}
    lab:
      - Read labs/LAB_SETUP.md, then run `docker compose -f labs/docker-compose.yml up -d`.
      - Open Juice Shop on http://localhost:3000 and DVWA on http://localhost:8081, and confirm both load.
      - "Exec into the attacker box: `docker compose -f labs/docker-compose.yml exec attacker bash`, then `curl -I http://juice-shop:3000`."
      - "Run `docker compose -f labs/docker-compose.yml ps` and confirm every published port is bound to 127.0.0.1 only. Write down why that matters."
    explain: "Why must vulnerable lab targets never be exposed on a public IP, and how did you enforce that?"
    bridge: You already know Compose and networks. This is the same skill pointed at a security lab.
    deliverable: notes/day-04.md with a screenshot or the output proving the lab works.

  - day: 5
    title: Linux command line for security, part 1
    area: Foundations
    outcome: Move around Linux, read files in awkward ways, and use ssh comfortably under pressure.
    learn:
      - {t: "OverTheWire Bandit wargame", u: "https://overthewire.org/wargames/bandit/"}
      - {t: "NetworkChuck, Linux for Hackers (YouTube playlist): first two episodes", u: "https://www.youtube.com/playlist?list=PLIhvC56v63IJIujb5cyE13oLuyORZpdkL"}
    lab:
      - Play Bandit levels 0 to 6.
      - For each level, record the command that solved it and the concept (hidden files, spaces in names, file types).
      - Never store the passwords themselves in the repo; store the technique.
    explain: "How would you find every file on a server owned by user X, of size 33 bytes, that is not executable?"
    deliverable: labs/writeups/bandit.md (levels 0-6).

  - day: 6
    title: Linux command line for security, part 2
    area: Foundations
    outcome: Use find, grep, sort, uniq, base64, tr and tar/gzip to dig through data fast.
    learn:
      - {t: "OverTheWire Bandit wargame (continue)", u: "https://overthewire.org/wargames/bandit/"}
      - {t: "GTFOBins (bookmark it; you will use it on day 40)", u: "https://gtfobins.github.io/"}
    lab:
      - Play Bandit levels 7 to 13.
      - Note how ROT13, hexdump and nested compression show up and which tool decoded each.
      - Write a one-line shell alias you would add to your attacker box after today.
    explain: "Why do attackers and defenders both live in the shell? Give two tasks where grep beats a GUI."
    deliverable: labs/writeups/bandit.md (levels 7-13).

  - day: 7
    title: Week 1 review and checkpoint
    area: Review
    outcome: Explain week 1 concepts without notes and fill your gaps.
    learn:
      - {t: "roadmap.sh Cyber Security roadmap (see where week 1 sits)", u: "https://roadmap.sh/cyber-security"}
    lab:
      - Answer the week 1 questions in sme/INTERVIEW_QUESTIONS.md out loud, and record yourself on your phone.
      - Rate yourself 1-5 on each day in the tracker and redo the lowest one.
      - "Stretch: Bandit levels 14-16 (netcat, openssl s_client)."
    explain: "Teach CIA, risk and the CSF to a non-technical friend in 3 minutes."
    deliverable: notes/week-01-review.md with your confidence ratings and gaps.

  # ---------------------------------------------------------------- Phase 2
  - day: 8
    title: OSI and TCP/IP models, TCP handshake
    area: Networking
    outcome: Walk through encapsulation layer by layer and spot a TCP three-way handshake in a capture.
    learn:
      - {t: "Cloudflare Learning: What is the OSI model?", u: "https://www.cloudflare.com/learning/ddos/glossary/open-systems-interconnection-model-osi/"}
      - {t: "freeCodeCamp: Computer Networking Course (YouTube), watch the TCP/IP and OSI sections", u: "https://www.youtube.com/watch?v=qiQR5rTSshw"}
    lab:
      - "In the attacker container: `tcpdump -i any -nn -w /tmp/day08.pcap port 3000` in one shell."
      - In another shell run `curl http://juice-shop:3000`, then stop the capture.
      - "Read it back with `tcpdump -nn -r /tmp/day08.pcap` and label SYN, SYN-ACK, ACK, data and FIN."
    explain: "What happens at each layer when you type a URL and press Enter, and where can an attacker interfere?"
    deliverable: notes/day-08.md with the annotated handshake.

  - day: 9
    title: IP addressing, subnets, NAT and ports
    area: Networking
    outcome: Subnet quickly, explain NAT, and know the 20 most common ports and what runs on them.
    learn:
      - {t: "Subnetting practice", u: "https://subnettingpractice.com/"}
      - {t: "Cloudflare Learning: What is a computer port?", u: "https://www.cloudflare.com/learning/network-layer/what-is-a-computer-port/"}
    lab:
      - Do 10 subnetting questions until you can answer each in under 60 seconds.
      - "Run `ss -tulpn` on your machine and in the lab containers and map each listening port to a service."
      - "Write the common ports table from memory (22, 25, 53, 80, 88, 135, 139, 389, 443, 445, 636, 1433, 3306, 3389, 5432, 5985, 6379, 8080, 9200, 27017), then check it."
    explain: "Why is 0.0.0.0/0 on port 22 in a security group a finding, and what would you replace it with?"
    bridge: VPC CIDRs, security groups and NAT gateways are this exact topic. You will review them as an auditor now.
    deliverable: notes/day-09.md with your ports table.

  - day: 10
    title: DNS and HTTP through a security lens
    area: Networking
    outcome: Trace a DNS resolution, read every part of an HTTP request and response, and name DNS attacks.
    learn:
      - {t: "Cloudflare Learning: What is DNS?", u: "https://www.cloudflare.com/learning/dns/what-is-dns/"}
      - {t: "MDN: An overview of HTTP", u: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview"}
      - {t: "freeCodeCamp: How does the internet work? (YouTube)", u: "https://www.youtube.com/watch?v=zN8YNNHcaZc"}
    lab:
      - "`dig +trace example.com` and label root, TLD and authoritative servers."
      - "`dig example.com TXT`, `dig example.com MX` and explain what each record is used for."
      - "`curl -v https://example.com` and label the method, status code, headers and cookies."
      - Write two lines each on DNS spoofing/cache poisoning, DNS tunnelling and subdomain takeover.
    explain: "How can DNS be used to exfiltrate data, and how would you detect it?"
    deliverable: notes/day-10.md

  - day: 11
    title: Packet analysis with Wireshark
    area: Networking
    outcome: Filter, follow streams and pull evidence (credentials, files, hostnames) out of a pcap.
    learn:
      - {t: "Wireshark User's Guide", u: "https://www.wireshark.org/docs/wsug_html_chunked/"}
      - {t: "Wireshark sample captures", u: "https://wiki.wireshark.org/SampleCaptures"}
    lab:
      - Install Wireshark on your host machine.
      - Download a plain-text protocol capture (HTTP or FTP or Telnet) from the sample captures page.
      - "Use display filters: `http.request`, `ftp`, `tcp.stream eq 0`, `dns.qry.name contains`."
      - Use Follow TCP Stream to recover the cleartext credentials or content, then write what control would have prevented it.
    explain: "A pcap from a breach lands on your desk. What are the first five filters you apply and why?"
    deliverable: notes/day-11.md with your filters cheat sheet.

  - day: 12
    title: Network reconnaissance with Nmap
    area: Networking
    outcome: Choose the right Nmap scan for the job and interpret open, closed and filtered results.
    learn:
      - {t: "Nmap reference guide", u: "https://nmap.org/book/man.html"}
      - {t: "Nmap: port scanning basics", u: "https://nmap.org/book/man-port-scanning-basics.html"}
    lab:
      - "From the attacker container: `nmap -sn 172.30.0.0/24` to find hosts on the lab network."
      - "`nmap -sV -sC -p- juice-shop dvwa` and record services and versions."
      - Compare a SYN scan (-sS) and a connect scan (-sT) and note the difference in your own words.
      - Only scan your lab or scanme.nmap.org, which Nmap explicitly allows. Scanning anything else needs written permission.
    explain: "Why can a port show as 'filtered', and what does that tell you about the network?"
    deliverable: labs/writeups/nmap-lab.md

  - day: 13
    title: Firewalls, IDS/IPS, segmentation and zero trust
    area: Networking
    outcome: Explain stateful firewalls, WAFs, IDS vs IPS, segmentation and the core zero trust tenets.
    learn:
      - {t: "Cloudflare Learning: What is a firewall?", u: "https://www.cloudflare.com/learning/security/what-is-a-firewall/"}
      - {t: "NIST SP 800-207, Zero Trust Architecture", u: "https://csrc.nist.gov/pubs/sp/800/207/final"}
    lab:
      - In a throwaway Ubuntu container or VM, install nftables or ufw.
      - Default-deny inbound, allow only 22 from one IP, and allow established traffic.
      - Prove it with nmap from the attacker box before and after.
      - Write the rule set and the evidence into your notes.
    explain: "What does 'never trust, always verify' change compared with a VPN plus flat network?"
    bridge: Kubernetes NetworkPolicies and service meshes (mTLS) are zero trust in practice. You will meet them again on day 53.
    deliverable: notes/day-13.md

  - day: 14
    title: Week 2 review and checkpoint
    area: Review
    outcome: Draw a packet's journey with every security control on the path.
    learn:
      - {t: "Cloudflare Learning: What happens in a TLS handshake? (preview for week 4)", u: "https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/"}
    lab:
      - "Draw (draw.io or paper) a browser to database request: DNS, CDN/WAF, load balancer, firewall, app, DB."
      - Mark where TLS terminates, where logs are produced and where an attacker could sit.
      - Answer the week 2 questions in sme/INTERVIEW_QUESTIONS.md out loud.
    explain: "Walk an interviewer through that diagram in 3 minutes."
    deliverable: notes/week-02-review.md with the diagram.

  # ---------------------------------------------------------------- Phase 3
  - day: 15
    title: Linux hardening and logging
    area: Systems
    outcome: Audit and harden a Linux host, and know where its security logs live.
    learn:
      - {t: "Lynis security auditing tool", u: "https://cisofy.com/lynis/"}
      - {t: "Mozilla OpenSSH guidelines", u: "https://infosec.mozilla.org/guidelines/openssh"}
    lab:
      - In an Ubuntu container, install and run `lynis audit system`, and note the hardening index.
      - "Find SUID binaries: `find / -perm -4000 -type f 2>/dev/null`."
      - Harden sshd_config (no root login, no passwords, modern ciphers) and explain each line.
      - "Look at /var/log/auth.log (or `journalctl -u ssh`) and find failed logins."
      - Re-run Lynis and record the new score.
    explain: "Give the five Linux hardening steps you would bake into every base image and why."
    bridge: Golden images and Ansible roles are where these controls belong. Hardening is config management.
    deliverable: notes/day-15.md with before/after Lynis scores.

  - day: 16
    title: Windows security fundamentals
    area: Systems
    outcome: Explain Windows accounts, UAC, the registry, and the event IDs every analyst knows.
    learn:
      - {t: "TryHackMe: Windows Fundamentals 1 (free room)", u: "https://tryhackme.com/room/windowsfundamentals1xbx"}
      - {t: "Ultimate Windows Security: event ID encyclopedia", u: "https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/"}
      - {t: "Microsoft Sysinternals Sysmon", u: "https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon"}
    lab:
      - Complete the TryHackMe room (it gives you a browser-based Windows VM).
      - "Learn these event IDs and write one line each: 4624, 4625, 4634, 4648, 4672, 4688, 4720, 4732, 1102, 7045."
      - Note what Sysmon adds over the default logs (process command lines, network connections, hashes).
    explain: "Which Windows events would show a brute-force attack followed by a successful login and a new admin user?"
    deliverable: notes/day-16.md with your event ID table.

  - day: 17
    title: Active Directory and Kerberos basics
    area: Systems
    outcome: Explain domains, OUs, GPOs, Kerberos tickets and the classic AD attacks at concept level.
    learn:
      - {t: "Microsoft Learn: Active Directory Domain Services overview", u: "https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/active-directory-domain-services-overview"}
      - {t: "Microsoft Learn: Kerberos authentication overview", u: "https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-authentication-overview"}
      - {t: "Optional, TryHackMe premium: Active Directory Basics (hands-on AD in the browser)", u: "https://tryhackme.com/room/winadbasics"}
    lab:
      - "Write a one-page AD cheat sheet from the reading: domain, forest, tree, OU, group, GPO, domain controller, trust."
      - Draw the Kerberos flow (AS-REQ, TGT, TGS-REQ, service ticket).
      - Write one paragraph each on Kerberoasting, pass-the-hash and Golden Ticket, and the defence for each.
    explain: "Why is Active Directory the first thing attackers go after in a corporate network?"
    deliverable: notes/day-17.md with your Kerberos diagram.

  - day: 18
    title: Authentication, passwords, MFA and passkeys
    area: Identity
    outcome: Explain modern password guidance, how passwords should be stored, and why phishing-resistant MFA matters.
    learn:
      - {t: "OWASP Password Storage Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"}
      - {t: "Computerphile: How NOT to Store Passwords! (YouTube)", u: "https://www.youtube.com/watch?v=8ZtInClXe1Q"}
      - {t: "FIDO Alliance: passkeys", u: "https://fidoalliance.org/passkeys/"}
    lab:
      - Create 5 test passwords of your own (weak and strong), hash them with MD5 and bcrypt using Python.
      - Crack the MD5 ones with hashcat or john and a small wordlist, then try the bcrypt ones and time it.
      - Write down why salting and slow hashes changed the outcome.
    explain: "Why are SMS codes weaker than passkeys, and what is MFA fatigue?"
    deliverable: notes/day-18.md with your timings.

  - day: 19
    title: Authorization, IAM and least privilege
    area: Identity
    outcome: Compare RBAC and ABAC, write least-privilege policies, and explain privileged access management.
    learn:
      - {t: "AWS IAM security best practices", u: "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"}
      - {t: "Kubernetes RBAC", u: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"}
    lab:
      - Take an over-broad IAM policy (s3:* on *) and rewrite it to read one bucket prefix only.
      - Write a Kubernetes Role and RoleBinding that only lets a CI service account update one Deployment.
      - List three ways a role can be escalated (iam:PassRole, wildcard actions, bind/escalate verbs in RBAC).
    explain: "What is least privilege, and how do you actually achieve it at scale without slowing engineers down?"
    bridge: You have written IAM and RBAC for pipelines. Now review them asking 'what is the worst thing this identity can do?'
    deliverable: notes/day-19.md with both policies.

  - day: 20
    title: Federation with OAuth 2.0, OIDC, SAML and JWT
    area: Identity
    outcome: Explain the OAuth authorization code flow with PKCE, how OIDC adds identity, and common JWT mistakes.
    learn:
      - {t: "OAuth 2.0 and OpenID Connect (in plain English), Nate Barbettini (YouTube)", u: "https://www.youtube.com/watch?v=996OiexHze0"}
      - {t: "JWT introduction", u: "https://jwt.io/introduction"}
      - {t: "PortSwigger Web Security Academy: JWT attacks", u: "https://portswigger.net/web-security/jwt"}
    lab:
      - Create a free PortSwigger account and solve the first JWT lab (unverified signature).
      - Decode a JWT and explain header, payload and signature.
      - Write the 5 steps of the authorization code flow with PKCE from memory.
    explain: "What is the difference between OAuth and OIDC, and when would you still pick SAML?"
    deliverable: labs/writeups/portswigger-jwt.md

  - day: 21
    title: Week 3 review and checkpoint
    area: Review
    outcome: Defend a host and an identity design in front of a reviewer.
    learn:
      - {t: "Microsoft Learn: Zero Trust overview (identity pillar)", u: "https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview"}
    lab:
      - Answer the week 3 questions in sme/INTERVIEW_QUESTIONS.md out loud.
      - Write a one-page 'identity standard' for a company (MFA, SSO, joiner/mover/leaver, break-glass accounts).
    explain: "An attacker steals a developer laptop. Walk through which identity controls limit the damage."
    deliverable: notes/week-03-review.md

  # ---------------------------------------------------------------- Phase 4
  - day: 22
    title: Symmetric and asymmetric crypto, key exchange
    area: Cryptography
    outcome: Explain AES, block modes, RSA/ECC and Diffie-Hellman, and when each is used.
    learn:
      - {t: "Computerphile: Public Key Cryptography (YouTube)", u: "https://www.youtube.com/watch?v=GSIDS_lvRv4"}
      - {t: "Computerphile: Secret Key Exchange (Diffie-Hellman) (YouTube)", u: "https://www.youtube.com/watch?v=NmM9HA2MQGI"}
      - {t: "CyberChef", u: "https://gchq.github.io/CyberChef/"}
    lab:
      - "Encrypt and decrypt a file with `openssl enc -aes-256-cbc -pbkdf2 -salt`. Note that `openssl enc` cannot do AEAD modes like GCM, which is one reason apps use crypto libraries instead."
      - "Generate an Ed25519 and an RSA key with `openssl genpkey` and compare sizes."
      - In CyberChef, encrypt the same text with AES-ECB and AES-CBC and see why ECB leaks patterns.
    explain: "Why does TLS use asymmetric crypto to agree a key and then switch to symmetric crypto?"
    deliverable: notes/day-22.md

  - day: 23
    title: Hashing, MACs and digital signatures
    area: Cryptography
    outcome: Distinguish hash, HMAC and signature, and sign and verify artifacts.
    learn:
      - {t: "Computerphile: Hashing Algorithms and Security (YouTube)", u: "https://www.youtube.com/watch?v=b4b8ktEV4Bg"}
      - {t: "Sigstore documentation (cosign)", u: "https://docs.sigstore.dev/"}
    lab:
      - "`sha256sum` a file, change one byte and compare (avalanche effect)."
      - "Create an HMAC with `openssl dgst -sha256 -hmac`."
      - Sign a file with your Ed25519 key and verify it, then tamper with the file and verify again.
      - "Optional: sign a container image with `cosign sign-blob` or `cosign sign`."
    explain: "Why is a hash on a download page not enough to prove the file came from the vendor?"
    bridge: Artifact signing and checksum verification in pipelines are supply-chain controls. You are now the one who designs them.
    deliverable: notes/day-23.md

  - day: 24
    title: PKI and TLS
    area: Cryptography
    outcome: Read a certificate chain, explain the TLS 1.3 handshake and debug common TLS failures.
    learn:
      - {t: "The Illustrated TLS 1.3 Connection", u: "https://tls13.xargs.org/"}
      - {t: "Cloudflare Learning: What happens in a TLS handshake?", u: "https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/"}
    lab:
      - "`openssl s_client -connect github.com:443 -showcerts` and identify leaf, intermediate and root."
      - Look up a domain you know on crt.sh (https://crt.sh/) and explain Certificate Transparency.
      - Run the Qualys SSL Labs test (https://www.ssllabs.com/ssltest/) on a site you own or a big public site.
      - Create a local CA, issue a server cert and a client cert, and describe how mTLS uses them.
    explain: "A service throws 'certificate verify failed'. List five possible causes in order of likelihood."
    deliverable: notes/day-24.md

  - day: 25
    title: Secrets management and crypto failures
    area: Cryptography
    outcome: Explain why secrets leak, how to rotate them, and run a secrets manager and a secrets scanner.
    learn:
      - {t: "OWASP Secrets Management Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"}
      - {t: "Gitleaks", u: "https://github.com/gitleaks/gitleaks"}
      - {t: "HashiCorp Vault documentation", u: "https://developer.hashicorp.com/vault/docs"}
    lab:
      - "Run Vault in dev mode: `docker run --rm -p 8200:8200 hashicorp/vault`, then write and read a KV secret."
      - Make a scratch git repo, commit a fake AWS key, delete it in a second commit, then run gitleaks and find it.
      - Write the 4-step response to a real leaked key (revoke, rotate, investigate usage, prevent).
    explain: "Why is deleting a leaked secret from git not enough?"
    bridge: You have wired secrets into pipelines. Now ask what happens when one leaks and how fast you can rotate.
    deliverable: notes/day-25.md

  - day: 26
    title: Browser security model and security headers
    area: Web
    outcome: Explain same-origin policy, CORS, cookie flags and the main security headers.
    learn:
      - {t: "MDN: Same-origin policy", u: "https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy"}
      - {t: "MDN: Cross-Origin Resource Sharing (CORS)", u: "https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"}
      - {t: "MDN HTTP Observatory", u: "https://developer.mozilla.org/en-US/observatory"}
    lab:
      - Scan two public sites with the HTTP Observatory and compare grades.
      - In browser dev tools, inspect cookies on a site and note Secure, HttpOnly and SameSite.
      - Write the header set you would ship by default (CSP, HSTS, X-Content-Type-Options, frame-ancestors, Referrer-Policy).
    explain: "CORS is not a security control that protects your server. Explain why."
    bridge: These headers usually live in ingress or CDN config, which is your territory.
    deliverable: notes/day-26.md

  - day: 27
    title: OWASP Top 10 overview and Burp Suite
    area: Web
    outcome: Name the OWASP Top 10 categories and intercept, modify and replay requests in Burp.
    learn:
      - {t: "OWASP Top 10", u: "https://owasp.org/Top10/"}
      - {t: "Burp Suite: getting started", u: "https://portswigger.net/burp/documentation/desktop/getting-started"}
    lab:
      - Install Burp Suite Community and use its built-in browser.
      - Browse Juice Shop through Burp, send a login request to Repeater and change parameters.
      - Find the Juice Shop score board (hint, it is a hidden route) and solve one 1-star challenge.
    explain: "Pick three OWASP Top 10 categories and give a real-world breach for each."
    deliverable: labs/writeups/juice-shop.md (started)

  - day: 28
    title: Week 4 review and checkpoint
    area: Review
    outcome: Explain crypto and web basics with confidence and fix your weakest topic.
    learn:
      - {t: "Cryptopals crypto challenges (optional stretch, set 1)", u: "https://cryptopals.com/"}
    lab:
      - Answer the week 4 questions in sme/INTERVIEW_QUESTIONS.md out loud.
      - Explain the TLS handshake on a whiteboard in under 2 minutes, and record it.
      - "Stretch: Cryptopals set 1, challenges 1-3."
    explain: "Explain end-to-end encryption vs encryption in transit vs encryption at rest."
    deliverable: notes/week-04-review.md

  # ---------------------------------------------------------------- Phase 5
