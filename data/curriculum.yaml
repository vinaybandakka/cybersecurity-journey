      - Write which fields a good security log must have (who, what, when, where, outcome).
    explain: "Logging everything is expensive. How do you decide what goes into the SIEM?"
    bridge: You built observability stacks. A SIEM is observability with an adversary in the threat model.
    deliverable: notes/day-43.md

