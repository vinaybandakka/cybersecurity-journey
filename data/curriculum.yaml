    outcome: Secure a cluster with RBAC, Pod Security Standards, network policies and secrets handling.
    learn:
      - {t: "Kubernetes: Pod Security Standards", u: "https://kubernetes.io/docs/concepts/security/pod-security-standards/"}
      - {t: "OWASP Kubernetes Top 10", u: "https://owasp.org/www-project-kubernetes-top-ten/"}
      - {t: "kube-bench", u: "https://github.com/aquasecurity/kube-bench"}
    lab:
      - Create a cluster with kind (https://kind.sigs.k8s.io/).
      - Label a namespace with pod-security.kubernetes.io/enforce=restricted and try deploying a privileged pod.
      - Add a default-deny NetworkPolicy and prove it blocks traffic (kind needs a CNI such as Calico for policies).
      - Run kube-bench as a Job and review the failures.
    explain: "Name five things you check first when reviewing a Kubernetes cluster's security."
    deliverable: labs/k8s-security/ with manifests and findings.

  - day: 54
    title: CI/CD and software supply chain security
    area: DevSecOps
    outcome: Explain the OWASP CI/CD Top 10, SLSA, SBOMs and how to harden GitHub Actions.
    learn:
      - {t: "OWASP Top 10 CI/CD Security Risks", u: "https://owasp.org/www-project-top-10-ci-cd-security-risks/"}
      - {t: "SLSA framework", u: "https://slsa.dev/"}
      - {t: "GitHub Docs: Security hardening for GitHub Actions", u: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"}
    lab:
      - Generate an SBOM for a container image with syft (https://github.com/anchore/syft).
      - Review a GitHub Actions workflow you know for pull_request_target misuse, unpinned actions and over-broad GITHUB_TOKEN permissions.
      - Fix it (pin actions by SHA, set permissions to read-only by default, use OIDC instead of long-lived cloud keys).
    explain: "Explain the SolarWinds or the tj-actions/changed-files compromise and the controls that would have limited it."
    bridge: This is your strongest day. Pipelines you used to build are now an attack surface you defend.
    deliverable: notes/day-54.md with the before/after workflow.

  - day: 55
    title: AppSec tooling in the pipeline (SAST, SCA, DAST, IaC, secrets)
    area: DevSecOps
    outcome: Build a security pipeline and explain what each tool class finds and misses.
    learn:
      - {t: "Semgrep documentation", u: "https://semgrep.dev/docs/"}
      - {t: "Checkov (IaC scanning)", u: "https://www.checkov.io/"}
      - {t: "ZAP baseline scan (Docker)", u: "https://www.zaproxy.org/docs/docker/baseline-scan/"}
    lab:
      - Add .github/workflows/devsecops-demo.yml to a scratch repo with semgrep, gitleaks, checkov and trivy steps.
      - Add a deliberately bad Terraform file (public S3 bucket) and a vulnerable code snippet and watch the jobs fail.
      - Run a ZAP baseline scan against your local Juice Shop.
    explain: "A team complains the security scanners block every PR with noise. How do you fix that without losing coverage?"
    bridge: Pipeline design is your home turf. Security teams desperately need people who can do this well.
    deliverable: labs/devsecops-pipeline/ with the workflow and results.

  - day: 56
    title: Threat modeling
    area: DevSecOps
    outcome: Run a STRIDE threat model on a data flow diagram and turn threats into backlog items.
    learn:
      - {t: "Threat Modeling Manifesto", u: "https://www.threatmodelingmanifesto.org/"}
      - {t: "OWASP Threat Dragon", u: "https://owasp.org/www-project-threat-dragon/"}
      - {t: "OWASP Threat Modeling Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"}
    lab:
      - Draw a data flow diagram of a CI/CD pipeline deploying to Kubernetes, with trust boundaries.
      - Apply STRIDE to each element and list at least 8 threats.
      - Rank them and write mitigations as user stories.
    explain: "What are the four questions of threat modeling, and when in the SDLC should it happen?"
    deliverable: reports/threat-model-cicd.md

  # ---------------------------------------------------------------- Phase 9
  - day: 57
    title: Governance, risk and compliance (GRC)
    area: GRC
    outcome: Explain risk treatment, policies vs standards vs procedures, and what ISO 27001, SOC 2, PCI DSS and GDPR require.
    learn:
      - {t: "NIST Risk Management Framework", u: "https://csrc.nist.gov/projects/risk-management/about-rmf"}
      - {t: "AICPA: SOC 2 overview", u: "https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2"}
      - {t: "PCI Security Standards Council", u: "https://www.pcisecuritystandards.org/"}
    lab:
      - Write a one-page access control policy and a matching standard (specific settings) and procedure (steps).
      - Map three of your earlier labs to SOC 2 or ISO 27001 controls as audit evidence.
      - "List the four risk treatments (accept, mitigate, transfer, avoid) with an example each."
    explain: "Compliant is not the same as secure. Explain with an example."
    deliverable: notes/day-57.md

  - day: 58
    title: Security architecture and secure design principles
    area: Architecture
    outcome: Design a secure cloud architecture using defence in depth and secure design principles.
    learn:
      - {t: "AWS Well-Architected Framework: Security pillar", u: "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html"}
      - {t: "OWASP Secure Product Design Cheat Sheet", u: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html"}
    lab:
      - Design a 3-tier web app on AWS (or your cloud) and draw it.
      - Annotate identity, network, data protection, logging/detection and incident response controls.
      - Note which design principle (least privilege, fail secure, defence in depth, separation of duties) each control follows.
    explain: "Defend your architecture against a reviewer who asks 'what happens if the web tier is compromised?'"
    deliverable: reports/secure-architecture.md

  - day: 59
    title: Capstone, attack, detect, respond, fix
    area: Capstone
    outcome: Prove the fundamentals end to end in one exercise you can show in interviews.
    learn:
      - {t: "Pwning OWASP Juice Shop (official companion guide)", u: "https://pwning.owasp-juice.shop/"}
    lab:
      - Follow capstone/CAPSTONE.md. Exploit one Juice Shop vulnerability (SQLi login bypass).
      - Find the attack in the logs and write the detection.
      - Write a short incident report and a remediation (code fix or WAF rule plus pipeline check).
    explain: "Present the capstone in 5 minutes as if to a hiring panel."
    deliverable: capstone/REPORT.md

  - day: 60
    title: SME readiness, mock interview and next 90 days
    area: Capstone
    outcome: Answer fundamentals questions confidently and have a clear plan for the next level.
    learn:
      - {t: "CompTIA Security+ certification (a good next milestone)", u: "https://www.comptia.org/en-us/certifications/security/"}
      - {t: "roadmap.sh Cyber Security roadmap (pick your specialisation)", u: "https://roadmap.sh/cyber-security"}
    lab:
      - Do a 25-minute mock interview using 15 random questions from sme/INTERVIEW_QUESTIONS.md, recorded.
      - Re-rate every day in the tracker and list your three weakest areas.
      - Write your next 90-day plan (for example Security+ plus a cloud security or AppSec specialisation).
      - Polish the README of this repo as your public portfolio.
    explain: "Tell me about yourself: from DevOps to security, and why that makes you a stronger security engineer."
    deliverable: notes/day-60-next-90-days.md
