    explain: "How would you use ATT&CK to tell a CISO where the detection gaps are?"
    deliverable: labs/attack/<incident>-layer.json and notes/day-37.md

  - day: 38
    title: Vulnerability management, CVE, CVSS, EPSS and KEV
